<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>式の因数分解</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS_HTML"></script>
    <style>
        #inputExpr {
            font-size: 24pt;
            width: 60%;
            padding: 10px;
            margin: 10px 0;
        }
        #output {
            font-size: 32pt;
            color: blue;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            min-height: 50px;
        }
        button {
            font-size: 24pt;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <input type="text" id="inputExpr" placeholder="例: x^2 - 4"><br>
    <button onclick="factorize()">因数分解</button>
    <button onclick="clearInput()">入力欄をクリア</button>
    <button onclick="clearOutput()">出力欄をクリア</button>
    <div id="output"></div>

    <script>
        function factorize() {
            const inputExpr = document.getElementById('inputExpr').value;
            const url = `https://gamma.sympy.org/input/?i=factor(${encodeURIComponent(inputExpr)})`;

            fetch(url)
            .then(response => response.json())
            .then(data => {
                const result = data.queryresult.pods[0].subpods[0].plaintext;
                document.getElementById('output').innerHTML = `$$${result}$$`;
                MathJax.Hub.Queue(["Typeset", MathJax.Hub, "output"]);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('output').innerHTML = 'エラーが発生しました。';
            });
        }

        function clearInput() {
            document.getElementById('inputExpr').value = '';
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }
    </script>
</body>
</html>
