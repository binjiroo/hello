<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数式レンダリングモジュール</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .input-section {
            width: 80%;
            max-width: 600px;
            position: relative;
        }

        textarea {
            width: 100%;
            padding: 10px;
            font-size: 24px; /* 入力フォームのフォントサイズを24に設定 */
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* ボタンを中央揃え */
            align-items: center; /* ボタンを上下中央揃え */
        }

        .number-buttons, .alphabet-buttons, .symbol-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* 各セクションのボタンを中央揃え */
            align-items: center; /* 上下中央揃え */
            margin: 10px;
        }

        .number-buttons {
            order: 1;
        }

        .alphabet-buttons {
            order: 2;
        }

        .symbol-buttons {
            order: 3;
        }

        .buttons button {
            padding: 10px 0; /* 上下の余白を調整 */
            margin: 0px;
            cursor: pointer;
            font-size: 24px;
            width: auto; /* ボタンの幅を自動調整 */
            min-width: 5ch; /* 必要に応じて調整 */
            height: 60px; /* ボタンの高さを指定 */
            line-height: 1; /* テキストの行の高さを調整して中央揃え */
            box-sizing: border-box; /* パディングを含むボックスサイズ */
        }


        #renderButton, #clearInputButton, #clearOutputButton, #toggleLineNumberButton {
            padding: 10px 19px; /* ボタンサイズを10px 19pxに設定 */
            margin-top: 0px;
            font-size: 24px; /* フォントサイズを24pxに設定 */
        }

        .output-section {
            width: 80%;
            max-width: 600px;
            margin-top: 0px;
        }

        #renderedFormulas {
            white-space: pre-wrap;
            font-size: 60px; /* レンダリング結果のフォントサイズを60に設定 */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <textarea id="formulaInput" rows="10" placeholder="数式を入力してください" oninput="updateLineNumbers()"></textarea>
            <div class="buttons">
                <div class="number-buttons">
                    <button onclick="insertFormula('0')">0</button>
                    <button onclick="insertFormula('1')">1</button>
                    <button onclick="insertFormula('2')">2</button>
                    <button onclick="insertFormula('3')">3</button>
                    <button onclick="insertFormula('4')">4</button>
                    <button onclick="insertFormula('5')">5</button>
                    <button onclick="insertFormula('6')">6</button>
                    <button onclick="insertFormula('7')">7</button>
                    <button onclick="insertFormula('8')">8</button>
                    <button onclick="insertFormula('9')">9</button>
                </div>
                <div class="alphabet-buttons">
                    <button onclick="insertFormula('a')">a</button>
                    <button onclick="insertFormula('b')">b</button>
                    <button onclick="insertFormula('c')">c</button>
                    <button onclick="insertFormula('d')">d</button>
                    <button onclick="insertFormula('e')">e</button>
                    <button onclick="insertFormula('f')">f</button>
                    <button onclick="insertFormula('g')">g</button>
                    <button onclick="insertFormula('h')">h</button>
                    <button onclick="insertFormula('i')">i</button>
                    <button onclick="insertFormula('j')">j</button>
                    <button onclick="insertFormula('k')">k</button>
                    <button onclick="insertFormula('l')">l</button>
                    <button onclick="insertFormula('m')">m</button>
                    <button onclick="insertFormula('n')">n</button>
                    <button onclick="insertFormula('o')">o</button>
                    <button onclick="insertFormula('p')">p</button>
                    <button onclick="insertFormula('q')">q</button>
                    <button onclick="insertFormula('r')">r</button>
                    <button onclick="insertFormula('s')">s</button>
                    <button onclick="insertFormula('t')">t</button>
                    <button onclick="insertFormula('u')">u</button>
                    <button onclick="insertFormula('v')">v</button>
                    <button onclick="insertFormula('w')">w</button>
                    <button onclick="insertFormula('x')">x</button>
                    <button onclick="insertFormula('y')">y</button>
                    <button onclick="insertFormula('z')">z</button>
                    <button onclick="insertFormula('.')">.</button>
                    <button onclick="insertFormula(',')">,</button>
                    <button onclick="insertFormula(':')">:</button>
                    <button onclick="insertFormula(';')">;</button>
                </div>
                <div class="symbol-buttons">
                    <button onclick="insertFormula('()')">()</button>
                    <button onclick="insertFormula('{}')">{}</button>
                    <button onclick="insertFormula('[]')">[]</button>
                    <button onclick="insertFormula('+')">+</button>
                    <button onclick="insertFormula('-')">-</button>
                    <button onclick="insertFormula('*')">*</button>
                    <button onclick="insertFormula('÷')">÷</button>
                    <button onclick="insertFormula('=')">=</button>
                    <button onclick="insertFormula('\\neq')">≠</button>
                    <button onclick="insertFormula('&gt;')">&gt;</button>
                    <button onclick="insertFormula('&lt;')">&lt;</button>
                    <button onclick="insertFormula('\\leq')">≦</button>
                    <button onclick="insertFormula('\\geq')">≧</button>
                    <button onclick="insertFormula('←')">←</button>
                    <button onclick="insertFormula('→')">→</button>
                    <button onclick="insertFormula('↑')">↑</button>
                    <button onclick="insertFormula('↓')">↓</button>                    
                    <button onclick="insertFormula('|x|')">|x|</button>
                    <button onclick="insertFormula('\\|x\\|')">‖x‖</button>
                    <button onclick="insertFormula('\\sqrt{}')">平方根</button>
                    <button onclick="insertFormula('\\sqrt[n]{}')">n乗根</button>
                    <button onclick="insertFormula('\\frac{}{}')">½</button>
                    <button onclick="insertFormula('\\sqrt{}')">√</button>
                    <button onclick="insertFormula('^')">指数</button>
                    <button onclick="insertFormula('_')">下付</button>
                    <button onclick="insertFormula('\\sin{}')">sin</button>
                    <button onclick="insertFormula('\\cos{}')">cos</button>
                    <button onclick="insertFormula('\\tan{}')">tan</button>
                    <button onclick="insertFormula('\\cot{}')">cot</button>
                    <button onclick="insertFormula('\\sec{}')">sec</button>
                    <button onclick="insertFormula('\\csc{}')">csc</button>
                    <button onclick="insertFormula('e')">e</button>
                    <button onclick="insertFormula('\\pi{}')">π</button>
                    <button onclick="insertFormula('i')">i</button>
                    <button onclick="insertFormula('∞')">∞</button>                    
                    <button onclick="insertFormula('f(x)')">f(x)</button>
                    <button onclick="insertFormula(`f'(x)`)">f'(x)</button>
                    <button onclick="insertFormula('F(x)')">F(x)</button>
                    <button onclick="insertFormula(`F'(x)`)">F'(x)</button>
                    <button onclick="insertFormula('\\log')">log</button>
                    <button onclick="insertFormula('\\ln')">ln</button>
                    <button onclick="insertFormula('\\log_{base}')">logB</button>
                    <button onclick="insertFormula('\\frac{d}{dx}')">微分</button>
                    <button onclick="insertFormula('\\partial')">微分</button>
                    <button onclick="insertFormula('\\int_{a}^{b}')">定積分</button>
                    <button onclick="insertFormula('\\int')">不定積分</button>
                    <button onclick="insertFormula('\\displaystyle \\lim_{x \\to c}')">極限</button>
                    <button onclick="insertFormula('\\displaystyle \\sum_{i=1}^{n}')">総和</button>
                    <button onclick="insertFormula('\\displaystyle \\prod_{i=1}^{n}')">総乗</button>
                    <button onclick="insertFormula('\\displaystyle \a_{n}=a_{1}+(n-1)d')">等差</button>
                    <button onclick="insertFormula('\\displaystyle \a_{n}=a_{1}*r^{(n-1)}')">等比</button>
                </div>
            </div>
            <button id="renderButton" onclick="renderFormula()">レンダリング</button>
            <button id="clearInputButton" onclick="clearInput()">入力フォームをクリア</button>
            <button id="clearOutputButton" onclick="clearOutput()">レンダリング表示をクリア</button>
            <button id="toggleLineNumberButton" onclick="toggleLineNumbers()">番号表示</button>
        </div>
        <div class="output-section">
            <div id="renderedFormulas"></div>
        </div>
    </div>
    <script>
        let showLineNumbers = false; // 番号表示のオンオフ状態を管理する変数

        function insertFormula(formula) {
            const inputField = document.getElementById('formulaInput');
            const startPos = inputField.selectionStart;
            const endPos = inputField.selectionEnd;
            inputField.value = inputField.value.substring(0, startPos) + formula + inputField.value.substring(endPos, inputField.value.length);
            inputField.focus();
            inputField.selectionStart = startPos + formula.length;
            inputField.selectionEnd = startPos + formula.length;
            updateLineNumbers(); // 入力後に行番号を更新
        }

        function renderFormula() {
            const inputField = document.getElementById('formulaInput');
            const formulas = inputField.value.split('\n');
            const renderedFormulasDiv = document.getElementById('renderedFormulas');
            renderedFormulasDiv.innerHTML = '';
            formulas.forEach(formula => {
                const formulaLine = document.createElement('div');
                formulaLine.innerHTML = '\\(' + formula + '\\)';
                renderedFormulasDiv.appendChild(formulaLine);
            });
            MathJax.typesetPromise();
        }

        function clearInput() {
            document.getElementById('formulaInput').value = '';
            updateLineNumbers(); // 入力フォームをクリアした後に行番号を更新
        }

        function clearOutput() {
            document.getElementById('renderedFormulas').innerHTML = '';
        }

        function updateLineNumbers() {
            if (!showLineNumbers) return; // 番号表示がオフの場合は処理しない

            const inputField = document.getElementById('formulaInput');
            const lines = inputField.value.split('\n').map(line => line.trim()).filter(line => line !== '');
            const numberedLines = lines.map((line, index) => {
                return (index + 1).toString().padStart(2, '0') + ': ' + line;
            }).join('\n');
            inputField.value = numberedLines;
            inputField.selectionStart = inputField.selectionEnd = inputField.value.length; // Move cursor to end
        }

        function toggleLineNumbers() {
            showLineNumbers = !showLineNumbers; // 番号表示の状態を切り替える
            const inputField = document.getElementById('formulaInput');
            const lines = inputField.value.split('\n');
            if (showLineNumbers) {
                // 番号表示がオンの場合
                updateLineNumbers();
            } else {
                // 番号表示がオフの場合
                const unnumberedLines = lines.map(line => line.replace(/^\d{2}: /, '')).join('\n');
                inputField.value = unnumberedLines;
                inputField.selectionStart = inputField.selectionEnd = inputField.value.length; // Move cursor to end
            }
        }

        document.addEventListener('DOMContentLoaded', updateLineNumbers);
    </script>
</body>
</html>
