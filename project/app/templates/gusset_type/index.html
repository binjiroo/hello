<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>H型鋼計算アプリ</title>
    <script>
        async function sendData() {
            const response = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    steel_name: document.getElementById('steel_name').value,
                    sub_steel_name: document.getElementById('sub_steel_name').value,
                    gusset_name: document.getElementById('gusset_name').value,
                    t: document.getElementById('t').value,
                    hole_column_x: document.getElementById('hole_column_x').value,
                    hole_row_y: document.getElementById('hole_row_y').value,
                    hole_pitch_x: document.getElementById('hole_pitch_x').value,
                    hole_pitch_y: document.getElementById('hole_pitch_y').value,
                    hole_endpitch_x: document.getElementById('hole_endpitch_x').value,
                    hole_size: document.getElementById('hole_size').value,
                    y_set: document.getElementById('y_set').value,
                    s1: document.getElementById('s1').value,
                    s2: document.getElementById('s2').value,
                    lc: document.getElementById('lc').value,
                    lt: document.getElementById('lt').value,
                    ly: document.getElementById('ly').value,
                    offset_choice: document.querySelector('input[name="offset"]:checked').value,
                    mode: document.getElementById('mode').value
                })
            });
            const result = await response.json();
            alert("計算結果がクリップボードにコピーされました。");
        }
    </script>
</head>
<body>
    <select id="steel_name">
        {% for size in sizes %}
        <option>{{ size }}</option>
        {% endfor %}
    </select>

    <select id="sub_steel_name">
        {% for size in sizes %}
        <option>{{ size }}</option>
        {% endfor %}
    </select>

    <input id="gusset_name" placeholder="ガセット名">

    <select id="t">
        {% for val in t_list %}
        <option>{{ val }}</option>
        {% endfor %}
    </select>

    <select id="hole_column_x">
        {% for val in hole_num_list %}
        <option>{{ val }}</option>
        {% endfor %}
    </select>

    <select id="hole_row_y">
        {% for val in hole_num_list %}
        <option>{{ val }}</option>
        {% endfor %}
    </select>

    <select id="hole_pitch_x">
        {% for val in pitch_list %}
        <option>{{ val }}</option>
        {% endfor %}
    </select>

    <select id="hole_pitch_y">
        {% for val in pitch_list %}
        <option>{{ val }}</option>
        {% endfor %}
    </select>

    <select id="hole_endpitch_x">
        {% for val in pitch_list %}
        <option>{{ val }}</option>
        {% endfor %}
    </select>

    <select id="hole_size">
        {% for val in hole_size_list %}
        <option>{{ val }}</option>
        {% endfor %}
    </select>

    <input id="y_set" placeholder="高さ指定">
    <input id="s1" placeholder="s1">
    <input id="s2" placeholder="s2">
    <input id="lc" placeholder="lc">
    <input id="lt" placeholder="lt">
    <input id="ly" placeholder="ly">

    <select id="mode">
        <option value="1">mood1</option>
        <option value="2">mood2</option>
        <option value="3">mood3</option>
    </select>

    <div>
        オフセット選択:
        {% for i in range(1, 10) %}
            <label><input type="radio" name="offset" value="{{i}}" {% if i==5 %}checked{% endif %}>{{i}}</label>
        {% endfor %}
    </div>

    <button onclick="sendData()">計算</button>
</body>
</html>
